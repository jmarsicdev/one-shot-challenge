[project]
name = "one-shot-challenge"
version = "0.1.0"
description = "ITCS 6169/8169 Assignment 3: one-shot 16-class scene recognition with foundation models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "open-clip-torch>=2.30",
    "transformers>=4.50",
    "timm>=1.0",
    "numpy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "tqdm",
    "pillow",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
